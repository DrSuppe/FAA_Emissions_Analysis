[project]
name = "faa-emissions-analysis"
version = "0.1.0"
description = "Combustor-to-FTIR emissions modeling and inversion with Cantera"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cantera>=3.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
inference = [
  "numpyro>=0.14",
  "jax>=0.4.28",
  "arviz>=0.18",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
