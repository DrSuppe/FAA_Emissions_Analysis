# Reacting forward model: HyChem A2 Jet-A (POSF10325) + NOx skeletal mechanism.
# Provenance + citation: mechanisms/MECHANISM_PROVENANCE.md
# Saggese et al., Combust. Flame 212 (2020) 270-278; Glarborg et al., PECS 67 (2018) 31-68.
mechanism: mechanisms/A2NOx_skeletal.yaml
tracked_species:
  - O2
  - N2
  - H2O
  - CO2
  - CO
  - NO
  - NO2

# --- Reacting fuel/air inlet ---------------------------------------------------
# The combustor inlet is a FRESH (unburned) fuel/air mixture set by equivalence
# ratio. fuel = lumped HyChem pseudo-species POSF10325 (C11H22). The reacting
# stages (pilot_primary/secondary/main_zone) burn this mixture; the station CSV
# (PROBE_INLET, 1080 K) is the VALIDATION TARGET, not the inlet.
fuel_composition:
  POSF10325: 1.0
oxidizer_composition:
  O2: 0.21
  N2: 0.79
# Best-fit phi from calibrating predicted post-main-zone O2/CO2/H2O/CO against
# the station target (scripts/calibrate_phi.py; see model/README.md "Calibration").
# phi=0.64 minimizes the relative SSR over (O2, CO2, H2O, CO). The fit is limited
# by the SYNTHETIC target being stoichiometrically inconsistent for this fuel
# (target H2O/CO2 ~ 1.63; C11H22 yields ~1.0), so H2O cannot be matched. Honest
# residuals are reported by the calibration script.
equivalence_ratio: 0.64
# Inlet air preheat: assumed compressor-discharge temperature. Documented
# assumption (not a free knob); ~700 K is representative of a moderate-OPR gas
# turbine compressor exit. Probe temperature is then an INDEPENDENT validation
# check (emerges from combustion + wall heat loss).
t_inlet_air_k: 700.0
inlet_pressure_pa: 185000.0

# Legacy fallback only (used when no fuel is configured, e.g. inert unit tests).
inlet_composition:
  O2: 0.21
  N2: 0.79

stages:
  - name: pilot_primary
    distance_m: 0.05
    residence_time_s: 0.004
    wall_temperature_k: 1400.0
    ua_w_m2_k: 25.0
    area_m2: 0.08
    pressure_drop_pa: 300.0

  - name: pilot_secondary
    distance_m: 0.15
    residence_time_s: 0.006
    wall_temperature_k: 1300.0
    ua_w_m2_k: 18.0
    area_m2: 0.10
    pressure_drop_pa: 500.0
    mix_stream:
      O2: 0.21
      N2: 0.79
    mix_fraction: 0.04

  - name: main_zone
    distance_m: 0.45
    residence_time_s: 0.012
    wall_temperature_k: 1200.0
    ua_w_m2_k: 14.0
    area_m2: 0.30
    pressure_drop_pa: 1200.0
    mix_stream:
      O2: 0.21
      N2: 0.79
    mix_fraction: 0.05

  - name: probe_internal
    distance_m: 0.65
    residence_time_s: 0.010
    wall_temperature_k: 420.0
    ua_w_m2_k: 85.0
    area_m2: 0.05
    pressure_drop_pa: 2000.0
    restriction:
      area_m2: 3.2e-7
      discharge_coeff: 0.83
      gamma: 1.33
      downstream_pressure_pa: 155000.0

  - name: heated_ss_line
    distance_m: 2.10
    residence_time_s: 0.080
    wall_temperature_k: 465.0
    ua_w_m2_k: 45.0
    area_m2: 0.12
    pressure_drop_pa: 6500.0

  - name: control_panel_venturi
    distance_m: 2.60
    residence_time_s: 0.007
    wall_temperature_k: 465.0
    ua_w_m2_k: 35.0
    area_m2: 0.03
    pressure_drop_pa: 7000.0
    restriction:
      area_m2: 7.5e-7
      discharge_coeff: 0.87
      gamma: 1.33
      downstream_pressure_pa: 101325.0

  - name: heated_ptfe_to_ftir
    distance_m: 4.00
    residence_time_s: 0.140
    wall_temperature_k: 430.0
    ua_w_m2_k: 25.0
    area_m2: 0.20
    pressure_drop_pa: 3500.0
